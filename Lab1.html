<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiji Campus Bus & Weather Dashboard</title>

<style>
    /* Page Styling */
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #4facfe, #00f2fe);
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h1 {
        text-align: center;
        color: #0077b6;
    }

    label {
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #0077b6;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #005f87;
    }

    .box {
        margin-top: 20px;
        padding: 15px;
        background: #f2f2f2;
        border-radius: 5px;
    }

    #result {
        color: green;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Fiji Campus Bus & Weather Dashboard</h1>

    <!-- Budget Input -->
    <label>Enter Your Bus Fare Budget (FJD):</label>
    <input type="number" id="budget" placeholder="Example: 15">

    <!-- Button -->
    <button onclick="calculateRides()">Calculate Bus Rides</button>

    <!-- Result Box -->
    <div class="box">
        <h3>Bus Ride Result</h3>
        <p id="result">Enter your budget above.</p>
    </div>

    <!-- Weather Box -->
    <div class="box">
        <h3>Today's Weather in Nadi</h3>
        <p id="weather"></p>
    </div>

</div>

<script>

// Cost per bus ride
const BUS_FARE = 1.50;

// Function to calculate rides
function calculateRides() {

    // Read user's budget
    let budget = parseFloat(document.getElementById("budget").value);

    // Validate input
    if (isNaN(budget) || budget < 0) {
        document.getElementById("result").innerHTML =
            "Please enter a valid budget.";
        return;
    }

    // Calculate whole rides only
    let rides = Math.floor(budget / BUS_FARE);

    // Display answer
    document.getElementById("result").innerHTML =
        "With FJD $" + budget.toFixed(2) +
        ", you can afford <strong>" + rides +
        "</strong> bus ride(s).";
}

/*
This weather section uses sample data.
A real application would connect to a weather API
such as OpenWeatherMap.
*/

document.getElementById("weather").innerHTML =
    "🌤 Weather Forecast: Partly cloudy, 27°C, Light southeast winds.";

</script>

</body>
</html>
